version: "1"
services:
  - type: web
    name: grievance-ai-backend
    runtime: python
    region: oregon
    plan: free
    # Install from the pinned backend file, not the sparse root file.
    # The root requirements.txt is missing PyJWT, passlib/bcrypt, python-multipart,
    # email-validator, httpx, authlib and twilio — the app crashes on startup
    # without them (auth.py: import jwt; main.py: import bcrypt).
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Must be the ORIGIN of the deployed frontend (e.g.
      # https://grievance-frontend.onrender.com), comma-separated if several.
      # A localhost value here silently blocks every cross-origin call from the
      # real frontend — the browser refuses them with no server-side error to
      # explain it. Left unset, config.py falls back to "*", which works but is
      # wide open; set it explicitly once the frontend has a public URL.
      - key: CORS_ORIGINS
        sync: false
      # Without this the service boots on the non-persistent in-memory store.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: "grievance"
      # JWT signing secret. Render generates a random value on first deploy.
      # Changing it invalidates all outstanding access/refresh tokens.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Seed one admin account on startup (no-op if the email already exists).
      # Set both in the Render dashboard after the first deploy.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Live citizen SMS. All operator-supplied (dashboard only, never in git);
      # the provider refuses to send until SID + token + service SID are set.
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: DLT_ENTITY_ID
        sync: false
      - key: DLT_TEMPLATE_ID_STAGE
        sync: false
      - key: DLT_TEMPLATE_ID_OTP
        sync: false
