version: "1"
services:
  - type: web
    name: grievance-ai-backend
    runtime: python
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      # Without this the service boots on the non-persistent in-memory store.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: "grievance"
      - key: HF_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
